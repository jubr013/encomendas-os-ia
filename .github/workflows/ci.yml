name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      # Apontam para o banco do docker-compose.yml, com a senha fictícia de lá.
      DATABASE_URL: postgresql://encomendas:senha_ficticia@127.0.0.1:5432/encomendas
      DATABASE_URL_POOLED: postgresql://encomendas:senha_ficticia@127.0.0.1:5432/encomendas
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar o projeto
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Subir o banco
        run: docker compose up --detach --wait --wait-timeout 90
      - name: Aplicar as migrações
        run: python -m encomendas_os.migracoes
      - name: Testes
        # -rs lista no log cada teste pulado, com o motivo.
        run: pytest -rs
      - name: Mostrar os logs do banco
        if: failure()
        run: docker compose logs banco
