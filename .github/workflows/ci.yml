name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar o projeto
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Testes
        run: pytest
